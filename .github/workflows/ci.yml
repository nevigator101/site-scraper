# CI (AGENTS.md, RnD Labs standard §5). Every push and PR: ruff + pytest (including the browser
# crawl and the SSRF tests), Gitleaks over the whole history, pip-audit on the lock files and the
# checksum of the vendored standard. No container scan: the image never reaches production.
# Actions are pinned to commit SHAs and images to digests (Dependabot can update the Actions).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Standard unchanged
        run: cd docs/standard && sha256sum -c SHA256SUMS
      - name: Build the test image
        run: docker compose build test
      - name: Ruff and pytest (unit tests, SSRF tests and the end-to-end browser crawl)
        run: docker compose run --rm test

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks over the full git history
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v

  dependencies:
    name: dependencies (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: pip-audit on the hash-pinned lock files
        run: |
          pip install pip-audit==2.10.1
          pip-audit --strict --disable-pip --require-hashes -r requirements.txt -r requirements-dev.txt
