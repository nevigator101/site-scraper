name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker compose build test
      - name: Ruff and pytest (unit tests and the end-to-end browser crawl)
        run: docker compose run --rm test
